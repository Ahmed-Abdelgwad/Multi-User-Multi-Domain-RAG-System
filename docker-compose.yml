services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cleanfastapi
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=documents
      - MINIO_SECURE=false
      - EMBEDDING_MODEL_NAME=ibm-granite/granite-embedding-97m-multilingual-r2
      - ENTITY_EXTRACTION_BATCH_INTERVAL_SECONDS=300
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_NAME=ibm-granite/granite-4.2-8b
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
      - LOCAL_LLM_MODEL_NAME=qwen3:4b
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - db
      - redis
      - minio
      - neo4j
      # NOT ollama: its image (~2.5GB, CUDA-heavy base) repeatedly failed
      # to pull on this host's connection, and RAM is already
      # swap-saturated without it. Bring `ollama` up separately
      # (`docker compose up -d ollama`) once network/RAM allow -- api
      # doesn't need to wait on it since local_llm_enabled defaults to
      # false (API/OpenRouter tier only, until then).
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    command: sh -c "until alembic upgrade head; do echo 'Waiting for database...'; sleep 2; done && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    # pgvector's official image is plain Postgres + the `vector` extension
    # pre-installed; everything else about it matches postgres:17.
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=cleanfastapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cleanfastapi
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=documents
      - MINIO_SECURE=false
      - EMBEDDING_MODEL_NAME=ibm-granite/granite-embedding-97m-multilingual-r2
      - ENTITY_EXTRACTION_BATCH_INTERVAL_SECONDS=300
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
    depends_on:
      - db
      - redis
      - minio
      - neo4j
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    # concurrency=1, not 2: confirmed live (phase 7) that each forked
    # worker child loads its own independent copy of every lazily-loaded
    # model (sentence-transformers' embedding model, gliner2's extraction
    # model) rather than sharing one -- with concurrency=2, two periodic
    # batch-extraction ticks landing close together each spun up their
    # own full gliner2 load in parallel, which on this host's tight RAM
    # (already observed with swap near-exhausted) drove available memory
    # down to ~300MB and put a real task loading gliner2 for 5+ minutes,
    # almost certainly memory-thrashing. Single concurrency means at most
    # one model load (of either model) in memory at a time, at the cost
    # of serializing task throughput -- an explicit, deliberate tradeoff
    # for this RAM-constrained host, not an oversight.
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=1

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cleanfastapi
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=documents
      - MINIO_SECURE=false
      - EMBEDDING_MODEL_NAME=ibm-granite/granite-embedding-97m-multilingual-r2
      - ENTITY_EXTRACTION_BATCH_INTERVAL_SECONDS=300
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
    depends_on:
      - db
      - redis
      - minio
      - neo4j
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    command: celery -A src.tasks.celery_app beat --loglevel=info

  neo4j:
    # Spec 3.2's graph DB. RAM bounded deliberately: this host has
    # already been observed dropping to ~300MB available with swap
    # near-exhausted from the embedding + gliner2 extraction models
    # alone (see celery_worker's comment above) -- Neo4j's JVM heap and
    # page cache are capped well below its own defaults so a third
    # always-on service doesn't push this host over the edge. Re-check
    # live available RAM once this comes up, before building anything
    # else on top of it.
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"   # browser/HTTP
      - "7687:7687"   # bolt

  ollama:
    # Spec 3.5's local/internal generation tier. RAM risk flagged like
    # every other model addition on this host: qwen3:4b's weights alone
    # are a much bigger ask than anything loaded so far (embedding model,
    # gliner2, Neo4j combined). local_llm_enabled defaults to false --
    # this service starts and the model can be pulled, but the /query
    # path only ever routes to it when a domain's config explicitly asks
    # for the local route AND this flag is on. Re-check live available
    # RAM before enabling it for real.
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  neo4j_data:
  ollama_data:
